name: Android APK and AAB
on:
  push:
    branches:
      - codex/android-artifacts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      APP_NAME: "MathLess"
      APP_ID: "ai.upsczone.mathless"
      WEB_DIR: "out"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/cli@8 @capacitor/core@8 @capacitor/android@8
      - name: Configure Capacitor
        shell: bash
        run: |
          if [[ ! -f capacitor.config.ts && ! -f capacitor.config.js && ! -f capacitor.config.json ]]; then
            cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "$WEB_DIR",
            "server": { "androidScheme": "https" }
          }
          EOF
          fi
          if [[ ! -d android ]]; then npx cap add android; fi
          npx cap sync android
      - name: Build APK and AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
